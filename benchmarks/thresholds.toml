# Research declarations: real-data gates, case studies, and the calibration and verification
# runs behind lumencell's clonal and tree-support claims.
#
# ctr.gates deep-merges this file over the thresholds.toml that lumencell ships
# (lumencell/bench/policy), so the synthetic gates, the [clonal] and [tree_support] definitions
# and the regression rule come from the installed tool. A key set here wins. Thresholds are never
# lowered to make a method pass; every change is logged below with the reason. The tool-only
# changelog entries (2026-11-10 initial gates and metric definitions, 2026-11-12 clonal
# agreement) are in lumencell's file.

# Real datasets: a release gate (make bench-real), never run in CI. Set from the
# approved M1 plan and written down before the first real run (2026-11-10).
[real.pancreas.gates]
pt_spearman_lineage = { min = 0.70 }  # Alpha and Beta, against stage order
branch_accuracy = { min = 0.80 }      # Alpha and Beta cells on their own lineage
lineage_recall = { min = 1.0 }

[real.bonemarrow.gates]
pt_spearman_lineage = { min = 0.70 }  # Ery and Mono
branch_accuracy = { min = 0.75 }
lineage_recall = { min = 1.0 }

[real.gastrulation_erythroid.gates]
pt_spearman_global = { min = 0.60 }   # against real embryo time (E7.0-E8.5)
terminal_share = { min = 0.80 }       # Erythroid3 cells on one inferred lineage

# ---- Daniel 2022 (spec §6.1). Declared 2026-11-20 from the GEO sample records and metadata alone,
# before any clone was counted and before any method ran on it. See the changelog entry of that date.
# Declared not assessable (fewer than two gated lineages), so the two clonal gate lines are left out:
# a result declared not assessable is not gated, and it is shown with its reason, never hidden.
# With no gated lineage these gates score NaN and are skipped; Task 7 renders such a row as
# "lineage gates: not measured (no gated lineage, declared 2026-11-20)", never PASS.
[real.daniel2022.gates]
pt_spearman_lineage = { min = 0.70 }   # existing real-data value; against state order along each gated lineage
branch_accuracy = { min = 0.80 }       # the stricter existing value (pancreas 0.80, bone marrow 0.75)
lineage_recall = { min = 1.0 }

[real.daniel2022.clonal]
mode = "oracle_cells"    # scored cells come from the truth lineages, weighted by each method's masks (spec §3)
oracle_eta_min = 0.05    # below either floor the case is not_assessable, which fails both clonal gates
oracle_p_max = 0.01

[real.daniel2022.reported]   # reported, never gated
day_spearman = "Spearman of the method's pseudotime against day post infection, over cells finite in both"
clone_recurrence = "share of distinct clone_id strings found in two or more captures, namespace ignored on purpose: an estimate of convergent receptors if captures hold different mice"
raw_clonotype_ari = "adjusted Rand index between clone_id and 10x raw_clonotype_id, both keyed by capture, over cells labelled by both"
labelled_share_of_raw = "cells with a clone_id divided by cells with a raw_clonotype_id"
trb_only = "the clonal block again with clone_id_trb (1 or 2 qualifying TRB, sorted TRB CDR3 nt set): same mode, nulls and floor"

[clonal.calibration]
# Slow, run once and recorded (tests/clonal/test_calibration.py), at the [synthetic] preset and
# size. Seeds are disjoint from the gated matrix. Seed s uses topologies[(s - seed_start) % 3].
seed_start = 100
n_seeds = 200
topologies = ["bifurcation", "trifurcation", "binary2"]
depth_only_topology = "binary2"   # the topology whose lineages occupy different depths
alpha = 0.05
binomial_quantile = 0.99          # binom.ppf(0.99, 200, 0.05) = 18 rejections at most
monotonic_fate_bias = [0.0, 0.35, 0.7, 1.0]
monotonic_seeds = [0, 1, 2]
monotonic_topologies = ["bifurcation", "trifurcation", "binary2"]
# 2026-11-13  Pre-declared before the 200-seed run, so that no count has been seen. A p-value that
#   is NaN (an undefined score) is stored as null, never counted as a rejection and never as a
#   non-rejection. Such seeds are counted apart (n_nan) and reported per check. The rejection
#   bound uses the number of seeds that scored: bound = int(binom.ppf(binomial_quantile,
#   n_scored, alpha)), which is 18 when all 200 seeds score. A check passes (or, for a control
#   that must fail, fails) by comparing its rejections, p <= alpha, to that bound. A seed whose
#   method raises is a NaN p as well, and its error is listed in the report. No seed, definition
#   or threshold is changed after the run; a failed check is recorded as a failure.

[clonal.calibration_n2_amended]
# 2026-11-17  The N2 amendment's calibration (see [clonal] in lumencell's policy file): the same checks, alpha, bound
#   rule and NaN rule as [clonal.calibration], on fresh seeds clear of 0-5 and 100-299. Seed s
#   uses topologies[(s - seed_start) % 3]. Every null p, and so the headline p, uses the amended N2.
seed_start = 300
n_seeds = 200
topologies = ["bifurcation", "trifurcation", "binary2"]
depth_only_topology = "binary2"
alpha = 0.05
binomial_quantile = 0.99          # 18 rejections at most when all 200 seeds score
monotonic_fate_bias = [0.0, 0.35, 0.7, 1.0]
monotonic_seeds = [0, 1, 2]
monotonic_topologies = ["bifurcation", "trifurcation", "binary2"]

[tree_support.calibration]
# tau = (quantile(matrix values, matrix_quantile) + quantile(control values, control_quantile)) / 2,
# numpy.quantile, method "linear". If the matrix quantile is not above the control quantile, the
# check is non-discriminating and left out of the verdict. C3 and C4 pool every (dataset, method)
# run; C2 takes one value per dataset (methods do not change it), and an undefined C2 counts as
# 0. C2 is also measured at Leiden resolution x0.5 and x2 and is kept only if it discriminates at
# all three; tau_tree is the one at the default resolution. A run whose reference fails is left
# out and counted. C1's bound and C5's rule are fixed, not calibrated. Matrix: the [synthetic]
# topologies, preset and size. Controls: every [synthetic.controls] kind.
matrix_seeds = [0, 1, 2]
control_seeds = [0, 1, 2]
methods = ["paga_dpt", "palantir", "scfates_ppt"]
matrix_quantile = 0.10
control_quantile = 0.90
c2_resolution_factors = [0.5, 1.0, 2.0]

[tree_support.verification]
# Fresh seeds, the calibrated taus, C5 not applicable (no clonal settings). No control run may be
# verdicted supported. The share of matrix runs verdicted supported is reported, not gated.
matrix_seeds = [3, 4, 5]
control_seeds = [3, 4, 5]
max_controls_supported = 0
# If verification fails, every served verdict is capped at provisional, with a note naming the failed verification. Declared 2026-11-17, before any verdict was computed.
on_failure = "provisional"

# ---- case study (spec docs/notes/specs/2026-11-12-tcell-clonotypes-design.md §6.2)
# Declared before any analysis, from the paper and the file headers only (Task 9's note,
# docs/notes/research/2026-11-19-sheih-verification.md). Nothing was computed from clonotype,
# CDR3 or gene values. Reasons for each value: the changelog entry of the same date.

[case_study.sheih2020]   # declared before any analysis; see the changelog entry of the same date
declared = "2026-11-19"
accession = "GSE125881"
paper = "Sheih et al. 2020, Nat Commun 11:219, doi:10.1038/s41467-019-13880-1"
methods = ["paga_dpt", "palantir", "scfates_ppt"]
root = "cluster:timepoint=IP"   # the infusion product, which the post-infusion repertoire comes from: Results, "Contribution of infused CAR-T clusters to in vivo repertoire", Fig. 7
clone_key = "clone_id"
donor_key = "patient"          # namespace: each patient
single_donor = false
strata_keys = ["timepoint"]    # N3: clones that expand at one time point are not read as lineage agreement
chains = "paired"              # both chains' rows carry per-cell barcodes, so TRA and TRB group by cell
cdr3 = "nt"                    # the tables carry cdr3_nts
filters = []                   # the tables carry no productive, high_confidence or full_length flag
max_per_chain = 2
unit_key = "patient"           # primary analysis: each method runs once per patient (4 x 3 runs, stability on each)
pooled_diagnostic = true       # one pooled run per method, reported only as a labelled diagnostic, never the headline
# Clonal parameters are the [clonal] defaults: m = 2 primary, m = 3 sensitivity, B = 1000, seed 0.
# lumenCell has no batch correction. Pooled patients would let patient structure dominate, and C1/C2
# would then call a batch artefact "no tree". Cost: 12 runs with stability instead of 3, and about a
# quarter of the cells in each run.

# ---- changelog ---------------------------------------------------------------------
#
# 2026-11-10  Real-dataset gates added, before any method was run on real data.
#   The plan's "share of Erythroid3 cells on the main lineage" is implemented as
#   terminal_share (worst expected lineage's terminal-stage cells held by one
#   inferred lineage).
#
# 2026-11-13  Calibration run, results in benchmarks/results/clonal-calibration-2026-11-13.json
#   (200 seeds, bound 18, no NaN p-values, no method error): null/paga_dpt 6, null/palantir 7,
#   null/scfates_ppt 6 rejections, calibrated; donor_confound/N1 7, calibrated;
#   donor_confound/N1_donors_ignored 200, not calibrated as it must be; depth_only/N1 200, not
#   calibrated as it must be; depth_only/N2 57, NOT calibrated: FAILED. Oracle eta rises with
#   fate_bias and p at fate_bias 0 is above 0.01 on all 9 monotonic cases. No threshold or
#   definition changed.
#
# 2026-11-13  TR-gene exclusion re-run (Task 9). Results in benchmarks/results/real-2026-11-13.json,
#   run at 4b0b1d5; compared with real-2026-11-10.json (run at abe3f73, before the exclusion).
#   Receptor genes matched, and how many of them the old selection would have kept as HVGs:
#   pancreas 0 matched, 0 would have been HVGs; bonemarrow 11 matched, 6; gastrulation_erythroid
#   258 matched, 3. All matches are genuine TCR genes (bone marrow's 11, and the 258 mouse
#   Trav/Traj/Trbv/... genes). Bone marrow's 6 would-be HVGs: TRAC, TRDC, TRGC1, TRGC2, TRBC1,
#   TRBC2. Real rows now carry clonal_status = not_applicable. Moved: pancreas no metric moved. bonemarrow moved on all three methods, and
#   n_clusters 12 -> 13. paga_dpt branch_accuracy 0.917 -> 0.617 and lineage_recall 1.0 -> 0.5, both
#   now failing their gates; scfates_ppt pt_spearman_lineage 0.781 -> 0.668 now fails its gate;
#   palantir branch_accuracy 0.639 -> 0.943 and terminal_share 0.839 -> 0.986 improved.
#   gastrulation_erythroid: paga_dpt lineage_recall 0.0 -> 1.0, other metrics within 0.002 except
#   palantir terminal_share 0.591 -> 0.579 (a threshold flip for lineage_recall, not a gain in the
#   method). Attribution: the exclusion alone causes every move. With exclude_receptor_genes off at
#   HEAD the old file is reproduced to 3 decimals, and on it reproduces the new file, for every moved
#   metric; cold-cache bone marrow paga_dpt at 744a0a8 vs 7b6254b gives branch_accuracy 0.9171 ->
#   0.6171 and 12 -> 13 clusters, with identical repeats (no run-to-run variance). Since abe3f73
#   only 7b6254b changes the expression path. Fragility, stated plainly: swapping 6 (bone marrow) or
#   3 (gastrulation) of 2000 HVGs flips real-data gates; in bone marrow Leiden goes 12 -> 13 and
#   one lineage fails to match. No bug found. The failing gates stay failing; thresholds unchanged.
#
# 2026-11-17  T-cell robustness definitions: the cell_cycle stage and its per-run hint, the
#             stability replicates and comparison, the tree-support checks and levels, the tau
#             calibration and verification rule, and four negative controls outside the gated
#             matrix. All are set before any of them was measured. Nothing existing changed.
#             Also declared: [tree_support.verification] on_failure = "provisional", so a failed
#             verification caps every served verdict at provisional, with a note naming it
#             (amended 2026-11-19 by owner ruling H-1: only supported is capped; see below).
#
# 2026-11-17  N2 amendment declared (N2a), before any measurement: a lineage-onset split of N2's
#             strata (definition, reasons and adoption rule under [clonal]) and its calibration
#             table [clonal.calibration_n2_amended], seeds 300-499. [clonal.calibration] and
#             clonal-calibration-2026-11-13.json are unchanged; runtime N2 stays version 1 until
#             the recorded run passes.
#
# 2026-11-17  N2a calibration run, results in
#             benchmarks/results/clonal-calibration-n2-amended-2026-11-17.json (seeds 300-499, run
#             at 2b15c77, bound 18, no NaN p-values, no method error): null/paga_dpt 4,
#             null/palantir 3, null/scfates_ppt 3, donor_confound/N1 15, depth_only/N2 8
#             rejections, calibrated; donor_confound/N1_donors_ignored 200 and depth_only/N1 200,
#             not calibrated as they must be; the 9 monotonic cases pass. By the pre-declared rule
#             the amended N2 is the runtime N2 and metric_version goes 1 -> 2. Nothing was re-run
#             and no seed, bound or definition changed.
#
# 2026-11-17  Verdict calibration, results in benchmarks/results/verdict-calibration-2026-11-17.json
#             (run at 0a584d5, clean tree, 72 of 72 runs, 5 left out because the reference failed:
#             two_groups palantir seeds 0 and 2, two_groups scfates_ppt seeds 0-2):
#             C2 x0.5 matrix q10 0.908, control q90 0.852, discriminates (tau 0.880);
#             C2 x1.0 matrix q10 0.833, control q90 1.000, non-discriminating;
#             C2 x2.0 matrix q10 0.714, control q90 0.919, non-discriminating;
#             so C2 is non-discriminating (it must discriminate at all three);
#             C3 matrix q10 1.000, control q90 1.000, non-discriminating;
#             C4 matrix q10 0.998, control q90 0.999, non-discriminating.
#             No tau is set: tau_tree, tau_lin and tau_pt are all left out. Rule, seeds and controls unchanged.
#
# 2026-11-17  Verdict verification on seeds 3-5, benchmarks/results/verdict-verification-2026-11-17.json
#             (run at 37197c8, clean tree, 72 of 72 runs, 5 left out because the reference failed:
#             two_groups palantir seeds 3 and 4, scfates_ppt seeds 3-5): 28 of 31 control runs
#             supported (blob 9, loop 9, sheet 9, two_groups 1), max 0, so verification FAILED;
#             36 of 36 matrix runs supported (share 1.0, reported, not gated). Rule, taus and
#             seeds unchanged. Per [tree_support.verification] on_failure, [tree_support.verified]
#             passed = false and the served verdict is capped at provisional (VERDICT_VERIFIED).
#
# 2026-11-19  Owner ruling H-1: while the verification has failed, only supported is capped at
#             provisional; weak is served as is. No rule, tau or seed changed.
#
# 2026-11-17  Stability and the tree verdict reported on the real benchmarks (not gated),
#             benchmarks/results/real-2026-11-17.json (bench real, 9 of 9 rows, stability ok on all).
#             Every gated metric and n_clusters is identical to real-2026-11-13.json. C2 is the
#             default-resolution PAGA tree-likeness. A supported verdict is capped
#             at provisional because its verification failed on fresh seeds (2026-11-17); a
#             not_supported row is a real failure and is not capped (H-1, 2026-11-19: nor is weak). C2-C4 are non-discriminating,
#             so these levels are not evidence of a tree. C3 / C4 / tree-likeness / level:
#             bonemarrow paga_dpt 0.200 / 0.998 / 0.703 / not_supported (coverage 0.914);
#             bonemarrow palantir 0.200 / 0.996 / 0.703 / provisional;
#             bonemarrow scfates_ppt 0.857 / 0.952 / 0.703 / provisional;
#             gastrulation_erythroid paga_dpt 0.333 / 0.999 / 0.625 / provisional;
#             gastrulation_erythroid palantir 0.667 / 0.996 / 0.625 / provisional;
#             gastrulation_erythroid scfates_ppt 1.000 / 0.998 / 0.625 / provisional;
#             pancreas paga_dpt 0.200 / 0.997 / 0.666 / provisional;
#             pancreas palantir 0.400 / 0.999 / 0.666 / provisional;
#             pancreas scfates_ppt 0.800 / 0.988 / 0.666 / provisional.
#             No gate changed.
#
# 2026-11-19  Case study declared: [case_study.sheih2020], before any analysis and before the
#             case-study data is fetched (Task 11). Written from the paper (read as Europe PMC's
#             open full text of PMC6954177) and Task 9's note on the file headers; nothing was
#             computed from clonotype, CDR3 or gene values. Nothing existing changed.
#   * root = "cluster:timepoint=IP". The paper names no differentiation root: its Monocle 3
#     trajectory covers infusion-product cells only and did not give clear trajectories. It treats
#     the infusion product as the population the in vivo repertoire comes from (Results,
#     "Contribution of infused CAR-T clusters to in vivo repertoire", Fig. 7; Fig. 5 compares
#     blood to it). That is also the earliest sample, the plan's fallback. The order is the trial's
#     (cells are sampled from blood after the product is infused), never read from clones. "IP"
#     is GEO's "time point" spelling as written; Task 11 writes obs timepoint with exactly GEO's
#     values (IP, d12, d21, d28, d29, d38, d83, d89, d102, d112). Every patient (CLL-1, CLL-2,
#     NHL-6, NHL-7) has an IP sample (aggr IDs 1, 8, 16, 12). The time point is a stratum, so it
#     stays visible to methods and may define the root (spec §4.2, amended).
#     Assumption: IP as the start is assumed, not named by the paper; it is the earliest sample
#     and the source population of Fig. 7.
#   * chains = "paired" (Daniel's rule: 1 or 2 distinct CDR3s of each of TRA and TRB, the sorted
#     set). The GEO tables are labelled "unpaired" (one row per clonotype x chain), but every row
#     names its chain and lists its cells' barcodes, so TRA and TRB rows group by cell barcode.
#     The paper also used Cell Ranger vdj's paired clonotype calling. Cost: a cell with only one
#     chain detected gets no clone label.
#   * cdr3 = "nt": the tables carry cdr3_nts.
#   * filters = []. The tables carry none of productive, high_confidence and full_length (nor
#     is_cell): they are clonotype tables, not 10x contig annotations. Whether the authors kept
#     only productive chains is UNVERIFIED; the paper does not say.
#   * max_per_chain = 2, as Daniel; a cell with more distinct CDR3s on a chain is unlabelled.
#   * donor_key = unit_key = "patient", single_donor = false: the patient is the clone namespace,
#     so the same receptor in two patients is two clones. strata_keys = ["timepoint"], so N3
#     shuffles within patient x time point and the headline p includes it.
#   * Per patient is primary: each method runs once per patient, with stability on each.
#     lumenCell has no batch correction, and pooled patients would let patient structure dominate,
#     so C1/C2 could call a batch artefact "no tree". Each run then holds one donor, so N1-N3 are
#     within that patient. Cost: 12 runs with stability instead of 3, and about a quarter of the
#     cells in each run. A patient with too few clones reports too_few_clones; patients are never
#     merged to rescue a score. pooled_diagnostic = true: one pooled run per method, reported only
#     as a labelled diagnostic, never the headline.
#   * methods: all three; clonal parameters are the [clonal] defaults (m = 2 primary, m = 3
#     sensitivity, B = 1000, seed 0). No threshold is added or changed.
#
# 2026-11-20  Daniel 2022 declared: [real.daniel2022.*] and DATASETS["daniel2022"], before the
#             derived file was built, before any clone was counted and before any method ran on it.
#             Written from Task 3's note (with Task 5a's sections), the GSM records and the
#             literature; evidence for every item in
#             docs/notes/research/2026-11-20-daniel2022-declaration.md. Nothing existing changed.
#   * Captures, days, tissues: GSM5687827-GSM5687834 (8 TCR GSMs; chronic Clone 13, spleen, D8 and
#     D21; PD-1+, gp33 mid, gp33- x2, gp33+ x2 at D21, gp33- and gp33+ at D8). Chronic only, because
#     the Tpex root holds there (spec §6.1). D5 excluded: its matrix is a separate Seurat object with
#     a different 7-label vocabulary, and the records do not say it was processed with the main
#     matrix; a matrix processed apart would put a batch on the day axis. Liver and lung excluded:
#     sampled only at D21, so tissue would be confounded with day.
#   * Namespace: the capture (donor = the capture's GSM), by rule (b). The records name no mouse, so
#     (a) cannot apply; dropping the state-gated captures (GSM5687824 CX3CR1- SLAMF6+, GSM5687825
#     CX3CR1-, GSM5687826 CX3CR1+) leaves 8. Tetramer and PD-1 sorts are not state gates.
#     Assumption: one mouse per capture; the records do not say which mice a capture holds or whether
#     a capture pools mice.
#   * Clone definition: as common.call_clones (productive, high-confidence, full-length, is_cell
#     contigs; 1-2 distinct TRA and 1-2 TRB CDR3 nt sequences, their sorted set), keyed by capture.
#     clone_id_trb (1-2 TRB) is the sensitivity check, reported only.
#   * Root: TEx_prog, Daniel's Texprog (Tcf7, Slamf6, Id3; sorted PD-1+ SLAMF6+), matching Tpex
#     (Im et al. 2016; Utzschneider et al. 2016, abstract only; Beltra et al. 2020).
#   * Lineages: two end states arise from Tpex in the literature, by adoptive transfer of sorted
#     subsets: terminal exhaustion (TEx; Hudson et al. 2019, Beltra et al. 2020) with the CX3CR1+
#     transitory/intermediate stage on it, and the CX3CR1+ effector-like subset (Zander et al. 2019,
#     which does not show it converting). The CX3CR1+ subset maps to two Daniel labels (TEx_int and
#     TEx_KLR, by Daniel's non-clonal markers and the CX3CR1+ sort's label counts), so neither lineage
#     can be written as one label per stage: lineages = {} and gated = [].
#   * Gates: existing real-data values; where pancreas and bone marrow differ (branch_accuracy 0.80
#     against 0.75) the stricter is taken, so the choice cannot be read as lenient. With no gated
#     lineage these three score NaN, and NaN is skipped, so they measure nothing on Daniel; this is
#     stated here so that a pass is not read as one.
#     Clonal: not assessable, declared before any clone was counted: fewer than two gated lineages,
#     so no clonal comparison between lineages. clonal_excess_ratio and clonal_p are left out;
#     [real.daniel2022.clonal] keeps the synthetic mode and floor for the record.
#     With no gated lineage these gates score NaN and are skipped; Task 7 renders such a row as
#     "lineage gates: not measured (no gated lineage, declared 2026-11-20)", never PASS.
#
# 2026-11-20  Daniel 2022 first run, benchmarks/results/real-2026-11-20.json (33,188 cells, 8 captures).
#             Thresholds unchanged.
#   * paga_dpt: lineage gates not measured (no gated lineage), clonal not assessable (declared),
#     stability_pt 0.989, stability_lineage 0.833, tree_support provisional.
#   * palantir: lineage gates not measured, clonal not assessable, stability_pt 0.989,
#     stability_lineage 0.667, tree_support provisional.
#   * scfates_ppt: lineage gates not measured, clonal not assessable, stability_pt 0.990,
#     stability_lineage 1.0, tree_support provisional (read as not shown to be a tree).
#     No Daniel gate was measured, so none passed or failed. Pancreas, bone marrow and gastrulation
#     metrics are unchanged against real-2026-11-17.json (only clonal_reason null -> "").
